name: Python checks
on:
  push:
    branches: [main, 'feat/**', 'fix/**']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python: ['3.11', '3.12', '3.13', '3.14']
        include:
          - os: windows-latest
            python: '3.13'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: python -m pip install -e ".[web,ai,dev]"
      - run: python -m pytest -q
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --test tests/frontend.test.cjs
      - run: python -m build --wheel
      - name: Install browser check dependencies
        if: matrix.os == 'ubuntu-latest' && matrix.python == '3.13'
        run: |
          python -m pip install playwright
          python -m playwright install --with-deps chromium
      - name: Check the demo in Chromium
        if: matrix.os == 'ubuntu-latest' && matrix.python == '3.13'
        run: python scripts/check_browser.py --output-dir "${{ runner.temp }}/agentic-browser-checks"
      - name: Save browser screenshots and exports
        if: always() && matrix.os == 'ubuntu-latest' && matrix.python == '3.13'
        uses: actions/upload-artifact@v4
        with:
          name: browser-checks
          path: ${{ runner.temp }}/agentic-browser-checks
          retention-days: 7

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "agentic-ai-software-engineering"
version = "0.2.0"
description = "A local software planning workbench with demo and OpenAI-powered LangGraph workflows"
readme = "README.md"
requires-python = ">=3.11,<3.15"
dependencies = ["langgraph>=0.6.11,<0.7", "pydantic>=2.7,<3", "python-dotenv>=1,<2"]

[project.optional-dependencies]
web = ["fastapi>=0.115,<1", "uvicorn>=0.30,<1"]
ai = ["openai>=2,<3"]
dev = ["pytest>=8,<10", "httpx>=0.27,<1", "build>=1,<2"]

[project.scripts]
agentic-sdlc = "agentic_sdlc.runner:main"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
agentic_sdlc = ["static/*.html", "static/*.css", "static/*.js"]

